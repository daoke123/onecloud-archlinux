name: Build OneCloud ArchLinux (SD + Burn 线刷包)

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        description: Armbian 基础版本（仅作编译框架，rootfs 最终替换为 ArchLinuxARM）
        default: trixie
        type: choice
        options:
          - trixie
      BUILD_MINIMAL:
        description: 最小化内核（推荐 yes）
        default: "yes"
        type: choice
        options:
          - yes
          - no
      PRERELEASE:
        description: 标记为预发布（Pre-release）
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# 发布 Release 需要写仓库内容权限
permissions:
  contents: write

env:
  BOARD: onecloud
  BRANCH: current
  ARCH_ROOTFS: arch-rootfs.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 扩容磁盘（GitHub Runner 默认磁盘偏小，必须先扩容）
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: 安装编译与打包依赖
        run: |
          sudo apt update
          sudo apt install -y \
            git make kpartx rsync qemu-user-static \
            dosfstools e2fsprogs unzip wget \
            binutils file

      - name: 拉取 hzyitc Armbian build（含玩客云 onecloud 适配补丁）
        run: |
          git clone --depth=1 https://github.com/hzyitc/build.git
          cd build
          # 国内网络差时可取消下面注释做加速替换
          # find . -type f \( -name "*.sh" -o -name "*.conf" \) -exec sed -i 's/github.com/github.com.cnpmjs.org/g' {} \;

      - name: 下载 ArchLinuxARM aarch64 根文件系统
        run: |
          cd build
          wget -q https://mirror.archlinuxarm.org/aarch64/os/ArchLinuxARM-aarch64-latest.tar.gz
          mv ArchLinuxARM-aarch64-latest.tar.gz "${{ env.ARCH_ROOTFS }}"
          ls -lh "${{ env.ARCH_ROOTFS }}"

      - name: 编译内核 / u-boot / dtb / 镜像框架
        run: |
          cd build
          ./compile.sh \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ github.event.inputs.RELEASE }} \
            BUILD_MINIMAL=${{ github.event.inputs.BUILD_MINIMAL }} \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=yes \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,gz,img,burn

      - name: 替换 rootfs 为 ArchLinuxARM（SD 镜像 + burn 线刷包）
        run: |
          set -e
          cd build

          IMG=$(find output/images -name "*.img" ! -name "*.burn.img" | head -1)
          BURNIMG=$(find output/images -name "*.burn.img" | head -1)
          if [ -z "$IMG" ] || [ -z "$BURNIMG" ]; then
            echo "::error::未生成 SD 镜像或 burn 线刷包，请检查上方编译日志"
            exit 1
          fi
          echo "SD 镜像: $IMG"
          echo "Burn 线刷包: $BURNIMG"

          # ---------- 通用：解压 Arch rootfs 到指定挂载点 ----------
          prepare_rootfs() {
            local mnt="$1"          # rootfs 挂载点
            local root_dev="$2"     # fstab 根分区设备
            local boot_dev="$3"     # fstab boot 分区设备
            local boot_mounted="$4" # yes/no：boot 分区是否已单独挂载

            sudo rm -rf "${mnt:?}"/*
            sudo tar -xpf "${{ env.ARCH_ROOTFS }}" -C "$mnt"

            printf '%s\n' \
              "$root_dev  /      ext4  defaults  0 1" \
              "$boot_dev  /boot  vfat   defaults  0 2" \
              | sudo tee "$mnt/etc/fstab" >/dev/null

            printf 'onecloud-arch\n' | sudo tee "$mnt/etc/hostname" >/dev/null

            # ArchLinuxARM 国内镜像源（中科大）
            printf 'Server = https://mirrors.ustc.edu.cn/archlinuxarm/$arch/$repo\n' \
              | sudo tee "$mnt/etc/pacman.d/mirrorlist" >/dev/null

            sudo cp /usr/bin/qemu-aarch64-static "$mnt/usr/bin/"
            sudo chroot "$mnt" /bin/bash -c \
              "pacman-key --init && pacman-key --populate archlinuxarm && passwd -d root && systemctl enable sshd"

            if [ "$boot_mounted" = "yes" ]; then
              sudo umount "$mnt/boot"
            fi
            sudo umount "$mnt"
          }

          # ---------- 处理 SD 镜像（mmcblk0） ----------
          sudo kpartx -av "$IMG"
          sleep 2
          SD_ROOT=$(sudo kpartx -l "$IMG" | grep -o 'loop[0-9]*p2' | head -1)
          SD_BOOT=$(sudo kpartx -l "$IMG" | grep -o 'loop[0-9]*p1' | head -1)
          sudo mount "/dev/mapper/$SD_ROOT" /mnt
          sudo mount "/dev/mapper/$SD_BOOT" /mnt/boot
          prepare_rootfs /mnt /dev/mmcblk0p2 /dev/mmcblk0p1 yes
          sudo kpartx -dv "$IMG"
          gzip -kf "$IMG"

          # ---------- 处理 burn.img 线刷包（eMMC，mmcblk1） ----------
          sudo kpartx -av "$BURNIMG"
          sleep 2
          BURN_ROOT=$(sudo kpartx -l "$BURNIMG" | grep -o 'loop[0-9]*p2' | head -1)
          BURN_BOOT=$(sudo kpartx -l "$BURNIMG" | grep -o 'loop[0-9]*p1' | head -1)
          sudo mount "/dev/mapper/$BURN_ROOT" /mnt
          sudo mount "/dev/mapper/$BURN_BOOT" /mnt/boot
          prepare_rootfs /mnt /dev/mmcblk1p2 /dev/mmcblk1p1 yes
          sudo kpartx -dv "$BURNIMG"

      - name: 生成 SHA256 校验文件
        run: |
          cd build/output/images
          ls -lh
          sha256sum *.img.gz *.burn.img 2>/dev/null | tee SHA256SUMS.txt

      - name: 生成 Release 说明文档
        run: |
          cd build/output/images
          {
            echo "# 玩客云 OneCloud ArchLinuxARM 固件"
            echo
            echo "- 设备：玩客云（Amlogic S805 / meson8b，AArch64）"
            echo "- 系统：ArchLinuxARM aarch64（rootfs 来自官方 ArchLinuxARM 基础包）"
            echo "- 内核 / u-boot / 设备树：hzyitc onecloud 适配分支"
            echo "- 编译时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- 工作流：${{ github.workflow }} #${{ github.run_number }}"
            echo "- 提交：${{ github.sha }}"
            echo
            echo "## 产物清单"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`*.img.gz\` | SD / U 盘启动镜像，用 balenaEtcher / Rufus 写入存储卡 |"
            echo "| \`*.burn.img\` | eMMC 线刷包，用 Amlogic USB Burning Tool v2.1.3 烧录 |"
            echo "| \`SHA256SUMS.txt\` | 全部固件的 SHA256 校验值 |"
            echo
            echo "## 文件校验值"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "## 首次登录"
            echo
            echo "- 默认用户：\`root\`，默认密码：空（直接回车）"
            echo "- 插网线后在路由器后台查看 IP，或用 \`arp-scan\` / 路由器设备列表查找"
            echo "- 登录后立即执行：\`passwd root\` 设置密码"
            echo "- SSH 已默认开启；串口调试：\`ttyAML0,115200n8\`"
            echo
            echo "## 刷机方式"
            echo
            echo "### 方式一：SD / U 盘启动（推荐先试）"
            echo "1. 解压 \`*.img.gz\`"
            echo "2. 用 balenaEtcher 把镜像写入 SD 卡或 U 盘"
            echo "3. 插卡上电，从存储卡引导"
            echo
            echo "### 方式二：eMMC 线刷（burn.img）"
            echo "1. 打开 Amlogic USB Burning Tool **v2.1.3**（新版工具容易报错）"
            echo "2. 导入 \`*.burn.img\`，勾选擦除 flash / 擦除 bootloader"
            echo "3. 双公 USB 线连接电脑与玩客云，短接 / 按键进入升级模式"
            echo "4. 等待烧录完成后拔线上电"
            echo
            echo "## 常用命令"
            echo
            echo '```bash'
            echo "pacman -Syu                 # 系统更新"
            echo "pacman -S docker samba      # 安装软件"
            echo "systemctl status sshd       # 查看 SSH 状态"
            echo "uname -a                    # 查看内核版本"
            echo '```'
            echo
            echo "## 已知注意事项"
            echo
            echo "- S805 为 AArch64，请勿混入 armv7 软件包"
            echo "- 内核与 u-boot 依赖 hzyitc 适配补丁，主线内核 / 通用 u-boot 无法驱动网卡、USB 与 eMMC"
            echo "- ArchLinuxARM 本身不含 meson 固件，已由编译框架从适配分支带入"
            echo "- 线刷包与 SD 镜像分区设备号不同（eMMC=mmcblk1，SD=mmcblk0），fstab 已分别处理"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 上传构建产物到 Artifacts（留存 30 天）
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-arch-firmware
          path: |
            build/output/images/*.img
            build/output/images/*.img.gz
            build/output/images/*.burn.img
            build/output/images/SHA256SUMS.txt
            build/output/images/RELEASE_NOTES.md
          retention-days: 30

      - name: 发布到 GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onecloud-arch-${{ github.run_number }}
          name: "OneCloud ArchLinuxARM #${{ github.run_number }}"
          body_path: build/output/images/RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.PRERELEASE }}
          files: |
            build/output/images/*.img.gz
            build/output/images/*.burn.img
            build/output/images/SHA256SUMS.txt
            build/output/images/RELEASE_NOTES.md
