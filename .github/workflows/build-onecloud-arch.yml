name: Build OneCloud ArchLinux (Burn 线刷包)

on:
  workflow_dispatch:
    inputs:
      RELEASE:
        description: Armbian 基础版本（编译镜像框架用，rootfs 最终替换为 ArchLinuxARM）
        default: trixie
        type: choice
        options:
          - trixie
          - bookworm
          - noble
      BUILD_MINIMAL:
        description: 构建最小化镜像（推荐 yes，加快编译并节省空间）
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      PRERELEASE:
        description: 标记为预发布（Pre-release）
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

env:
  BOARD: onecloud
  BRANCH: current
  ARCH_ROOTFS_URLS: >-
    https://mirrors.ustc.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz
    https://mirrors.tuna.tsinghua.edu.cn/archlinuxarm/os/ArchLinuxARM-aarch64-latest.tar.gz
    https://mirror.archlinuxarm.org/aarch64/os/ArchLinuxARM-aarch64-latest.tar.gz
    http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz
  UBOOT_REPO: hzyitc/u-boot-onecloud
  UBOOT_TAG: latest
  UBOOT_BURNIMG: eMMC.burn.img

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 扩容磁盘
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          overprovision-lvm: "true"

      - name: 安装依赖
        run: |
          # 清理 apt 缓存并减少索引占用，避免根分区空间不足
          sudo rm -rf /var/lib/apt/lists/*
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99nolanguages >/dev/null
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates \
            qemu-user-static binfmt-support \
            kpartx dosfstools e2fsprogs \
            android-sdk-libsparse-utils \
            rsync file
          sudo apt-get clean
          # AmlImg 用于打包 Amlogic 线刷包
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64
          chmod +x ./AmlImg
          sudo mv ./AmlImg /usr/local/bin/AmlImg

      - name: 拉取 Armbian 官方构建框架
        run: |
          git clone --depth=1 https://github.com/armbian/build.git

      - name: 下载 ArchLinuxARM aarch64 根文件系统
        run: |
          set -euo pipefail
          URLS="${{ env.ARCH_ROOTFS_URLS }}"
          ok=0
          for url in $URLS; do
            for i in 1 2 3; do
              echo "尝试下载 ArchLinuxARM rootfs（$i/3）: $url"
              rm -f arch-rootfs.tar.gz
              if curl -fL --retry 2 --retry-delay 5 --connect-timeout 20 --max-time 1800 -o arch-rootfs.tar.gz "$url"; then
                if tar -tzf arch-rootfs.tar.gz >/dev/null 2>&1; then
                  echo "下载成功: $url"
                  ok=1
                  break 2
                fi
                echo "校验失败（非有效 tar.gz），尝试下一个源..."
              else
                echo "下载失败，稍后重试..."
                sleep 5
              fi
            done
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::无法从所有备用源下载 ArchLinuxARM rootfs"
            exit 1
          fi
          ls -lh arch-rootfs.tar.gz

      - name: 编译 Armbian 镜像框架（内核 / u-boot / dtb / 分区布局）
        run: |
          cd build
          sudo ./compile.sh build \
            ALLOW_ROOT=yes \
            BOARD=${{ env.BOARD }} \
            BRANCH=${{ env.BRANCH }} \
            RELEASE=${{ github.event.inputs.RELEASE }} \
            BUILD_MINIMAL=${{ github.event.inputs.BUILD_MINIMAL }} \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=img \
            EXPERT=yes
          sudo chown -R "$(id -u):$(id -g)" output/
          # 尽早清理构建中间产物以节省空间
          sudo rm -rf .tmp cache/rootfs cache/sources 2>/dev/null || true

      - name: 替换镜像 rootfs 为 ArchLinuxARM（用于生成 burn 包）
        run: |
          set -euo pipefail

          IMG=$(find build/output/images -name "*.img" ! -name "*.burn.img" | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::未找到编译生成的 .img 镜像"
            ls -R build/output || true
            exit 1
          fi
          echo "基础镜像: $IMG"

          cleanup() {
            set +e
            if mountpoint -q /mnt/arch/boot 2>/dev/null; then sudo umount /mnt/arch/boot; fi
            if mountpoint -q /mnt/arch 2>/dev/null; then sudo umount /mnt/arch; fi
            if [ -n "${LOOPDEV:-}" ]; then sudo kpartx -dv "$LOOPDEV" 2>/dev/null || true; sudo losetup -d "$LOOPDEV" 2>/dev/null || true; fi
          }
          trap cleanup EXIT

          sudo mkdir -p /mnt/arch
          LOOPDEV=$(sudo losetup --find --show --partscan "$IMG")
          echo "LOOPDEV=$LOOPDEV"
          sleep 2
          sudo kpartx -av "$LOOPDEV"
          sleep 2

          # 自动识别 p1(boot,vfat) 和 p2(root,ext4)
          MAP_BASE=$(basename "$LOOPDEV")
          BOOT_PART="/dev/mapper/${MAP_BASE}p1"
          ROOT_PART="/dev/mapper/${MAP_BASE}p2"
          [ -b "$BOOT_PART" ] || { echo "::error::未找到 boot 分区 $BOOT_PART"; exit 1; }
          [ -b "$ROOT_PART" ] || { echo "::error::未找到 root 分区 $ROOT_PART"; exit 1; }

          sudo mount "$ROOT_PART" /mnt/arch
          sudo mkdir -p /mnt/arch/boot
          sudo mount "$BOOT_PART" /mnt/arch/boot

          # 清空 rootfs（保留已挂载的 /boot 分区内容）
          sudo find /mnt/arch -mindepth 1 -maxdepth 1 ! -name boot -exec rm -rf {} +
          sudo find /mnt/arch/boot -mindepth 1 -delete 2>/dev/null || true

          # 解压 ArchLinuxARM rootfs
          sudo tar -xpf arch-rootfs.tar.gz -C /mnt/arch
          rm -f arch-rootfs.tar.gz

          # fstab（eMMC 线刷启动：mmcblk1）
          printf '%s\n' \
            '/dev/mmcblk1p2  /      ext4  defaults,noatime  0 1' \
            '/dev/mmcblk1p1  /boot  vfat  defaults          0 2' \
            | sudo tee /mnt/arch/etc/fstab >/dev/null

          echo "onecloud-arch" | sudo tee /mnt/arch/etc/hostname >/dev/null
          # 国内镜像源
          echo 'Server = https://mirrors.ustc.edu.cn/archlinuxarm/$arch/$repo' | sudo tee /mnt/arch/etc/pacman.d/mirrorlist >/dev/null

          # chroot 初始化（设置 root 空密码、启用 sshd）
          sudo cp /usr/bin/qemu-aarch64-static /mnt/arch/usr/bin/
          sudo mount --bind /dev /mnt/arch/dev
          sudo mount --bind /dev/pts /mnt/arch/dev/pts
          sudo mount -t proc proc /mnt/arch/proc
          sudo mount -t sysfs sys /mnt/arch/sys
          sudo rm -f /mnt/arch/etc/resolv.conf
          echo "nameserver 223.5.5.5" | sudo tee /mnt/arch/etc/resolv.conf >/dev/null

          sudo chroot /mnt/arch /usr/bin/qemu-aarch64-static /bin/bash -euc \
            'pacman-key --init; pacman-key --populate archlinuxarm; pacman -Sy --noconfirm --needed openssh; systemctl enable sshd; passwd -d root'

          sudo rm -f /mnt/arch/usr/bin/qemu-aarch64-static
          sudo rm -f /mnt/arch/etc/resolv.conf

          sync
          sudo umount /mnt/arch/sys /mnt/arch/proc /mnt/arch/dev/pts /mnt/arch/dev
          sudo umount /mnt/arch/boot
          sudo umount /mnt/arch
          sudo kpartx -dv "$LOOPDEV"
          sudo losetup -d "$LOOPDEV"
          unset LOOPDEV
          trap - EXIT

          echo "IMG_PATH=$IMG" >> "$GITHUB_ENV"
          echo "IMG_BASENAME=$(basename "$IMG" .img)" >> "$GITHUB_ENV"

      - name: 生成 eMMC 线刷包（burn.img）
        run: |
          set -euo pipefail
          IMG="${IMG_PATH}"
          WORKDIR="$(pwd)/burn-work"
          mkdir -p "$WORKDIR"

          # 下载 u-boot 线刷底包并解包
          curl -L -o "$WORKDIR/uboot.img" "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          (cd "$WORKDIR" && AmlImg unpack ./uboot.img burn)

          # 从已替换 rootfs 的镜像提取分区并转换为 sparse
          LOOPDEV=$(sudo losetup --find --show --partscan "$IMG")
          sleep 2
          sudo img2simg "${LOOPDEV}p1" "$WORKDIR/burn/boot.simg"
          sudo img2simg "${LOOPDEV}p2" "$WORKDIR/burn/rootfs.simg"
          sudo losetup -d "$LOOPDEV"
          sudo chown "$(id -u):$(id -g)" "$WORKDIR"/burn/*.simg

          # 生成校验与写入命令
          (cd "$WORKDIR/burn" && \
            echo -n "sha1sum $(sha1sum boot.simg | awk '{print $1}')" > boot.VERIFY && \
            echo -n "sha1sum $(sha1sum rootfs.simg | awk '{print $1}')" > rootfs.VERIFY && \
            printf 'PARTITION:boot:sparse:boot.simg\nVERIFY:boot:normal:boot.VERIFY\nPARTITION:rootfs:sparse:rootfs.simg\nVERIFY:rootfs:normal:rootfs.VERIFY\n' >> commands.txt)

          OUT_DIR="build/output/images"
          mkdir -p "$OUT_DIR"
          BURN_IMG="${OUT_DIR}/${IMG_BASENAME}.burn.img"
          AmlImg pack "$BURN_IMG" "$WORKDIR/burn"
          echo "BURN_IMG=$BURN_IMG" >> "$GITHUB_ENV"

          # 清理中间文件，仅保留 burn 包产物
          rm -rf "$WORKDIR"
          rm -f "$IMG"
          sudo rm -rf build/.tmp build/cache build/output/debs 2>/dev/null || true
          ls -lh "$OUT_DIR"

      - name: 生成校验与 Release 说明
        run: |
          set -euo pipefail
          cd build/output/images
          sha256sum "${IMG_BASENAME}.burn.img" > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt
          {
            echo "# 玩客云 OneCloud ArchLinuxARM 固件（仅 Burn 线刷包）"
            echo
            echo "- 设备：玩客云（Amlogic S805 / meson8b，AArch64）"
            echo "- 系统：ArchLinuxARM aarch64（官方 rootfs）"
            echo "- 内核 / u-boot / 设备树：Armbian 官方构建（onecloud / current）"
            echo "- 编译时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- 工作流：${{ github.workflow }} #${{ github.run_number }}"
            echo "- 提交：${{ github.sha }}"
            echo
            echo "## 产物清单"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`${IMG_BASENAME}.burn.img\` | eMMC 线刷包，用 Amlogic USB Burning Tool v2.1.3 烧录 |"
            echo "| \`SHA256SUMS.txt\` | SHA256 校验值 |"
            echo
            echo "## 文件校验值"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo "## 首次登录"
            echo
            echo "- 默认用户：\`root\`，默认密码：空（直接回车）"
            echo "- SSH 已开启；首次登录后请立即执行 \`passwd root\`"
            echo "- 串口：\`ttyAML0,115200n8\`"
            echo
            echo "## eMMC 线刷方式"
            echo "1. 使用 Amlogic USB Burning Tool **v2.1.3** 导入 \`.burn.img\`"
            echo "2. 勾选擦除 flash / 擦除 bootloader，短接进入升级模式后烧录"
            echo "3. eMMC 启动时 root 分区为 \`/dev/mmcblk1p2\`"
            echo
            echo "## 说明"
            echo
            echo "- 本构建为**仅 burn 线刷包**的低空间开销版本，不包含 SD/U 盘镜像（\`.img.xz\`）。"
            echo "- 如需 SD 卡启动，请使用包含 SD 镜像的构建版本。"
            echo
            echo "## 已知注意事项"
            echo
            echo "- S805 为 AArch64 架构，请勿混入 armv7 软件包"
            echo "- 若 pacman 初始化在首次启动未完成，可手动执行：\`pacman-key --init && pacman-key --populate archlinuxarm\`"
            echo "- 首次启动后建议：\`timedatectl set-timezone Asia/Shanghai && pacman -Syu\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: 上传构建产物到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onecloud-arch-burn
          path: |
            build/output/images/${{ env.IMG_BASENAME }}.burn.img
            build/output/images/SHA256SUMS.txt
            build/output/images/RELEASE_NOTES.md
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onecloud-arch-burn-${{ github.run_number }}
          name: "OneCloud ArchLinuxARM Burn #${{ github.run_number }}"
          body_path: build/output/images/RELEASE_NOTES.md
          prerelease: ${{ github.event.inputs.PRERELEASE }}
          files: |
            build/output/images/${{ env.IMG_BASENAME }}.burn.img
            build/output/images/SHA256SUMS.txt
            build/output/images/RELEASE_NOTES.md
